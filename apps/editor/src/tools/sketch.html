<h2 tabindex="0">Sketch</h2>
<div class="tool-fields sketch-fields">
  <div id="sketch-support"><p>Choose a construction plane or a planar solid face</p></div>
  <div id="sketch-workspace" hidden>
    <div class="sketch-variants" role="group" aria-label="Tool variants"></div>
    <div class="sketch-geometry-mode"><span>Geometry</span><div class="sketch-icon-options" id="sketch-construction" role="group" aria-label="Geometry mode"></div></div>
    <label class="check"><input id="sketch-auto" type="checkbox" checked /> Recompute automatically</label>
    <button id="sketch-recompute" type="button" hidden>Recompute</button>
    <output id="sketch-status" aria-live="polite"></output>
    <div class="sketch-option-section"><span>Highlight</span><div class="sketch-icon-options" id="sketch-highlight" role="group" aria-label="Highlight"></div></div>
    <div id="sketch-config">
      <label data-tools="offset">Distance <input id="sketch-offset" value="2" /></label>
      <label data-tools="offset" id="sketch-offset2-row">Second distance <input id="sketch-offset2" value="2" /></label>
      <label data-tools="scale">Scale <input id="sketch-scale" value="1" /></label>
      <label data-tools="move">Move X <input id="sketch-move-x" value="0" /></label>
      <label data-tools="move">Move Y <input id="sketch-move-y" value="0" /></label>
      <label data-tools="move scale" class="check"><input id="sketch-copy" type="checkbox" /> Copy</label>
      <button data-tools="move scale" id="sketch-pivot" type="button">Pick pivot</button>
      <label data-tools="spline" class="check"><input id="sketch-closed" type="checkbox" /> Closed</label>
      <label data-tools="text">Text <input id="sketch-text" value="Text" /></label>
      <label data-tools="text">Font <input id="sketch-font" type="file" accept=".ttf,.otf" /><small>Roboto, or import an OpenType/TrueType font</small></label>
      <label data-tools="text">Font weight <input id="sketch-weight" type="number" min="100" max="900" step="100" value="400" /></label>
      <label data-tools="text">Font size <input id="sketch-size" value="10" /></label>
      <label data-tools="text">Horizontal alignment <select id="sketch-horizontal"><option>left</option><option>center</option><option>right</option></select></label>
      <label data-tools="text">Vertical alignment <select id="sketch-vertical"><option>baseline</option><option>bottom</option><option>middle</option><option>top</option></select></label>
      <label data-tools="text" class="check"><input id="sketch-guide" type="checkbox" /> Use selected curve as guideline</label>
      <button id="sketch-action" type="button">Add geometry</button>
    </div>
    <div hidden><button id="sketch-repair-support" type="button">Change sketch plane</button><div id="sketch-projections"></div></div>
    <div class="sketch-option-section"><span>Display</span><div class="sketch-icon-options" id="sketch-display-options" role="group" aria-label="Display"></div></div>
    <div class="sketch-option-section"><span>Snap</span><div class="sketch-icon-options" id="sketch-snap-options" role="group" aria-label="Snap"></div></div>
  </div>
  <p class="field-error" id="sketch-error" role="alert" hidden></p>
</div>
<div class="sketch-live-dimensions" hidden>
  <label data-tools="rectangle ellipse line"><span>Width</span><input id="width" value="10" autocomplete="off" spellcheck="false" /></label>
  <label data-tools="rectangle ellipse"><span>Height</span><input id="height" value="10" autocomplete="off" spellcheck="false" /></label>
  <label data-tools="circle arc slot rounding"><span>Radius</span><input id="sketch-radius" value="5" autocomplete="off" spellcheck="false" /></label>
  <label data-tools="arc move"><span>Angle</span><input id="sketch-angle" value="90" autocomplete="off" spellcheck="false" /></label>
</div>
<div class="actions"><button id="cancel">Cancel</button><button id="apply" disabled>Finish sketch</button></div>
