<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PamatCAD · Untitled</title>
    <link rel="icon" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/loading.css" />
  </head>
  <body data-loading>
    <section id="loading-screen" aria-label="Starting PamatCAD" aria-busy="true">
      <img class="loading-logo" src="../../doc/media/logo-letters.svg" alt="PamatCAD" />
      <p id="loading-message" role="status">Starting PamatCAD…</p>
      <progress id="loading-progress" aria-label="Initializing editor"></progress>
      <p id="loading-error" role="alert" hidden></p>
      <button id="reload-editor" type="button" hidden>Reload</button>
    </section>
    <header class="menubar">
      <img class="wordmark" alt="PamatCAD" />
      <nav id="web-menu" aria-label="Application"></nav>
      <span id="runtime"></span>
    </header>
    <section class="document-bar" aria-label="Documents">
      <button id="document-home" type="button" aria-label="Home" title="Home"><img src="./src/icons/home.svg" alt="" /></button>
      <div id="document-tabs" role="tablist" aria-label="Open documents"></div>
    </section>
    <section class="ribbon" aria-label="Solid workbench">
      <div class="workbench">
        <label for="workbench">Workbench</label
        ><select id="workbench">
          <option value="solid">Solid</option>
          <option value="sketch">Sketch</option>
        </select>
      </div>
      <div id="solid-ribbon" class="workbench-tools">
        <div class="tool-group">
          <div class="tools">
            <button id="new-sketch" disabled><img src="./src/icons/sketch.svg" alt="" />New sketch</button>
            <button id="extrude" disabled>
              <img alt="" />Extrude
            </button>
          </div>
          <span>Solid</span>
        </div>
      </div>
      <div id="sketch-ribbon" class="workbench-tools" hidden></div>
    </section>
    <main>
      <aside class="browser" id="scene-browser" aria-label="Scene browser">
        <div class="browser-header">
          <div class="tabs" id="browser-tabs" role="tablist" aria-label="Scene objects">
            <button id="components-tab" role="tab" aria-label="Components" title="Components"
              aria-selected="false" aria-controls="browser-content" tabindex="-1">
              <img src="./src/icons/components.svg" alt="" /><span>Components</span>
            </button>
            <button id="construction-tab" role="tab" aria-label="Construction" title="Construction"
              aria-selected="false" aria-controls="browser-content" tabindex="-1">
              <img src="./src/icons/construction.svg" alt="" /><span>Construction</span>
            </button>
            <button id="bodies-tab" role="tab" aria-label="Bodies" title="Bodies"
              aria-selected="true" aria-controls="browser-content">
              <img src="./src/icons/scene.svg" alt="" /><span>Bodies</span>
            </button>
            <button id="sketches-tab" role="tab" aria-label="Sketches" title="Sketches"
              aria-selected="false" aria-controls="browser-content" tabindex="-1">
              <img src="./src/icons/sketch.svg" alt="" /><span>Sketches</span>
            </button>
          </div>
          <button id="toggle-browser" type="button" title="Collapse scene browser"
            aria-label="Collapse scene browser" aria-expanded="true" aria-controls="browser-tabs browser-content">
            <img src="./src/icons/collapse-left.svg" alt="" />
          </button>
        </div>
        <div id="browser-content" role="tabpanel" aria-labelledby="bodies-tab"></div>
        <div id="browser-resize" role="separator" tabindex="0" aria-label="Resize scene browser"
          aria-orientation="vertical" aria-controls="scene-browser" aria-valuemin="220" aria-valuenow="220"></div>
      </aside>
      <section id="viewport" role="tabpanel" aria-label="3D viewport">
        <div id="empty-document" hidden><p>No open documents</p><button id="empty-new-scene" type="button">New scene</button></div>
        <div class="view-top">
          <button id="sketch-view" title="Look at sketch" aria-label="Look at sketch" hidden><img src="./src/icons/sketch.svg" alt="" /></button>
          <button id="home" title="Fit isometric view" aria-label="Fit isometric view">
            <img src="./src/icons/home.svg" alt="" />
          </button>
        </div>
        <div id="tool-panel" hidden></div>
        <div class="view-bottom" role="group" aria-label="View controls">
          <button id="camera-mode" type="button" title="Camera mode" aria-label="Camera mode"
            aria-expanded="false" aria-controls="camera-modes">
            <img src="./src/icons/perspective.svg" alt="" />
          </button>
          <div id="camera-modes" role="radiogroup" aria-labelledby="camera-modes-title" hidden>
            <h2 id="camera-modes-title">Camera mode</h2>
            <label>
              <input type="radio" name="projection" value="orthographic" checked />
              <img src="./src/icons/orthographic.svg" alt="" />Orthographic
            </label>
            <label>
              <input type="radio" name="projection" value="perspective" />
              <img src="./src/icons/perspective.svg" alt="" />Perspective
            </label>
          </div>
        </div>
      </section>
    </main>
    <section class="timeline" aria-label="Timeline">
      <h2>Timeline</h2>
      <ol id="features"></ol>
    </section>
    <section class="dock" id="output-dock" aria-label="Output" hidden>
      <div class="tabs" aria-label="Output">
        <button data-dock="console" aria-selected="true">Console</button
        ><button data-dock="log" aria-selected="false">CAD log</button
        ><button data-dock="tree" aria-selected="false">Scene browser</button>
        <button id="dock-location" type="button">Pop out</button>
      </div>
      <div id="console" class="dock-page">
        <div id="console-output" role="log"></div>
        <form id="console-form">
          <label for="js">›</label
          ><input
            id="js"
            autocomplete="off"
            spellcheck="false"
            placeholder="Run JavaScript with core and scene"
            aria-label="JavaScript"
          /><button>Run</button>
        </form>
      </div>
      <div id="log" class="dock-page" hidden></div>
      <div id="tree" class="dock-page" hidden></div>
    </section>
    <footer>
      <div class="status-message">
        <span class="indicator" aria-hidden="true"></span>
        <span id="status" role="status">Starting geometry engine…</span>
        <progress id="progress" hidden></progress>
      </div>
      <div class="status-details" aria-label="Application information">
        <span id="versions"></span><span aria-hidden="true">|</span>
        <span id="memory-footprint">RAM unavailable</span><span aria-hidden="true">|</span>
        <button id="toggle-output" type="button" aria-expanded="false" aria-controls="output-dock">
          <span class="console-icon" aria-hidden="true"></span>Debug console
        </button>
      </div>
    </footer>
    <template id="extrude-fields">
      <h2 tabindex="0">
        Extrude
      </h2>
      <div class="tool-fields">
        <p id="selection-hint">
        </p>
        <div id="profiles-selection" class="geometry-input">
          <span>
            Profiles
          </span>
          <div>
            <button id="pick-profiles" type="button">
              Select…
            </button>
            <button id="clear-profiles" type="button" aria-label="Clear profiles">
              Clear
            </button>
          </div>
          <small id="profiles-items">
          </small>
        </div>
        <label id="extrude-start-field">
          Start
          <select id="extrude-start">
            <option value="profilePlane">
              Profile plane
            </option>
            <option value="offset">
              Offset
            </option>
            <option value="object">
              From a face
            </option>
          </select>
        </label>
        <label id="offset-field" class="formula-field">
          <span>
            Start offset
          </span>
          <input id="offset" value="0" />
        </input>
      </label>
      <div id="start-selection" class="geometry-input">
        <span>
          Starting face
        </span>
        <div>
          <button id="pick-start" type="button">
            Select…
          </button>
          <button id="clear-start" type="button" aria-label="Clear starting face">
            Clear
          </button>
        </div>
        <small id="start-items">
        </small>
      </div>
      <label id="extrude-type-field">
        Sides
        <select id="extrude-type">
          <option value="oneSide">
            One side
          </option>
          <option value="twoSides">
            Two sides
          </option>
          <option value="symmetric">
            Symmetric
          </option>
        </select>
      </label>
      <label id="extrude-direction-field">
        Reverse extent direction
        <input id="extrude-reverse" type="checkbox" />
      </label>
      <label id="symmetric-field">
        Length means
        <select id="symmetric-length">
          <option value="total">
            Total length
          </option>
          <option value="half">
            Half-length
          </option>
        </select>
      </label>
      <fieldset id="side1">
        <legend>
          Side 1
        </legend>
        <label id="extent1-field">
          End condition
          <select id="extent1">
            <option value="length">
              Distance
            </option>
            <option value="throughAll">
              Through all
            </option>
            <option value="toObject">
              To object
            </option>
          </select>
        </label>
        <label id="length1-field" class="formula-field">
          <span>
            Length
          </span>
          <input id="length" value="15" />
        </input>
      </label>
      <div id="limit1-selection">
        <div class="geometry-input">
          <span>
            Limiting body
          </span>
          <div>
            <button id="pick-limit1" type="button">
              Select…
            </button>
            <button id="clear-limit1" type="button" aria-label="Clear limiting body">
              Clear
            </button>
          </div>
          <small id="limit1-items">
          </small>
        </div>
        <label id="object-extent1-field">
          Stop at
          <select id="object-extent1">
            <option value="closest">
              Closest
            </option>
            <option value="touch">
              Touch
            </option>
            <option value="intersect">
              Intersect
            </option>
            <option value="farthest">
              Farthest
            </option>
          </select>
        </label>
      </div>
      <label id="taper1-field" class="formula-field">
        <span>
          Taper angle
        </span>
        <input id="taper1" value="0" />
      </input>
    </label>
  </fieldset>
  <fieldset id="side2">
    <legend>
      Side 2
    </legend>
    <label id="extent2-field">
      End condition
      <select id="extent2">
        <option value="length">
          Distance
        </option>
        <option value="throughAll">
          Through all
        </option>
        <option value="toObject">
          To object
        </option>
      </select>
    </label>
    <label id="length2-field" class="formula-field">
      <span>
        Length
      </span>
      <input id="length2" value="15" />
    </input>
  </label>
  <div id="limit2-selection">
    <div class="geometry-input">
      <span>
        Limiting body
      </span>
      <div>
        <button id="pick-limit2" type="button">
          Select…
        </button>
        <button id="clear-limit2" type="button" aria-label="Clear limiting body">
          Clear
        </button>
      </div>
      <small id="limit2-items">
      </small>
    </div>
    <label id="object-extent2-field">
      Stop at
      <select id="object-extent2">
        <option value="closest">
          Closest
        </option>
        <option value="touch">
          Touch
        </option>
        <option value="intersect">
          Intersect
        </option>
        <option value="farthest">
          Farthest
        </option>
      </select>
    </label>
  </div>
  <label id="taper2-field" class="formula-field">
    <span>
      Taper angle
    </span>
    <input id="taper2" value="0" />
  </input>
</label>
</fieldset>
<label id="extrude-mode-field">
Result
<select id="extrude-mode">
  <option value="auto">Auto — New</option>
  <option value="newBody">
    New body
  </option>
  <option value="cut">
    Cut
  </option>
  <option value="join">
    Join
  </option>
  <option value="intersect">Intersect</option>
</select>
</label>
<div id="targets-section">
<label id="target-scope-field">
  Targets
  <select id="target-scope">
    <option value="all">
      All bodies
    </option>
    <option value="selected">
      Selected bodies
    </option>
  </select>
</label>
<div id="target-selection">
  <div id="targets-selection" class="geometry-input">
    <span>
      Target bodies
    </span>
    <div>
      <button id="pick-targets" type="button">
        Select…
      </button>
      <button id="clear-targets" type="button" aria-label="Clear target bodies">
        Clear
      </button>
    </div>
    <small id="targets-items">
    </small>
  </div>
</div>
</div>
<p id="extrude-error" class="field-error" role="status">
</p>
</div>
<div class="actions">
<button id="cancel">
Cancel
</button>
<button id="apply">
Apply
</button>
</div>
</template>
    <script type="module" src="./src/bootstrap.ts"></script>
  </body>
</html>
