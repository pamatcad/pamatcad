<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PamatCAD · Untitled</title>
    <link rel="icon" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/loading.css" />
  </head>
  <body data-loading>
    <section id="loading-screen" aria-label="Starting PamatCAD" aria-busy="true">
      <img class="loading-logo" src="../../doc/media/logo-letters.svg" alt="PamatCAD" />
      <p id="loading-message" role="status">Starting PamatCAD…</p>
      <progress id="loading-progress" aria-label="Initializing editor"></progress>
      <p id="loading-error" role="alert" hidden></p>
      <button id="reload-editor" type="button" hidden>Reload</button>
    </section>
    <header class="menubar">
      <img class="wordmark" alt="PamatCAD" />
      <nav id="web-menu" aria-label="Application"></nav>
      <span id="runtime"></span>
    </header>
    <section class="document-bar" aria-label="Documents">
      <button id="document-home" type="button" aria-label="Home" title="Home"><img src="./src/icons/home.svg" alt="" /></button>
      <div id="document-tabs" role="tablist" aria-label="Open documents"></div>
    </section>
    <section class="ribbon" aria-label="Solid workbench">
      <div class="workbench">
        <label for="workbench">Workbench</label
        ><select id="workbench" data-tooltip="Workbench">
          <option value="solid">Solid</option>
          <option value="sketch">Sketch</option>
        </select>
      </div>
      <div id="solid-ribbon" class="workbench-tools">
        <div class="tool-group">
          <div class="tools">
            <button id="new-sketch" data-tooltip="New sketch" data-tooltip-command="sketch.create" disabled><img src="./src/icons/sketch.svg" alt="" />New sketch</button>
            <button id="extrude" data-tooltip="Extrude" data-tooltip-command="solid.extrude" disabled>
              <img alt="" />Extrude
            </button>
          </div>
          <span>Solid</span>
        </div>
      </div>
      <div id="sketch-ribbon" class="workbench-tools" hidden></div>
    </section>
    <main>
      <aside class="browser" id="scene-browser" aria-label="Scene browser">
        <div class="browser-header">
          <div class="tabs" id="browser-tabs" role="tablist" aria-label="Scene objects">
            <button id="components-tab" role="tab" aria-label="Components" title="Components"
              aria-selected="false" aria-controls="browser-content" tabindex="-1">
              <img src="./src/icons/components.svg" alt="" /><span>Components</span>
            </button>
            <button id="construction-tab" role="tab" aria-label="Construction" title="Construction"
              aria-selected="false" aria-controls="browser-content" tabindex="-1">
              <img src="./src/icons/construction.svg" alt="" /><span>Construction</span>
            </button>
            <button id="bodies-tab" role="tab" aria-label="Bodies" title="Bodies"
              aria-selected="true" aria-controls="browser-content">
              <img src="./src/icons/scene.svg" alt="" /><span>Bodies</span>
            </button>
            <button id="sketches-tab" role="tab" aria-label="Sketches" title="Sketches"
              aria-selected="false" aria-controls="browser-content" tabindex="-1">
              <img src="./src/icons/sketch.svg" alt="" /><span>Sketches</span>
            </button>
          </div>
          <button id="toggle-browser" type="button" title="Collapse scene browser"
            aria-label="Collapse scene browser" aria-expanded="true" aria-controls="browser-tabs browser-content">
            <img src="./src/icons/collapse-left.svg" alt="" />
          </button>
        </div>
        <div id="browser-content" role="tabpanel" aria-labelledby="bodies-tab"></div>
        <div id="browser-resize" role="separator" tabindex="0" aria-label="Resize scene browser"
          aria-orientation="vertical" aria-controls="scene-browser" aria-valuemin="220" aria-valuenow="220"></div>
      </aside>
      <section id="viewport" role="tabpanel" aria-label="3D viewport">
        <div id="empty-document" hidden><p>No open documents</p><button id="empty-new-scene" type="button">New scene</button></div>
        <div class="view-top">
          <button id="sketch-view" title="Look at sketch" aria-label="Look at sketch" hidden><img src="./src/icons/sketch.svg" alt="" /></button>
          <button id="home" title="Fit isometric view" aria-label="Fit isometric view">
            <img src="./src/icons/home.svg" alt="" />
          </button>
        </div>
        <div id="tool-panel" hidden></div>
        <div class="view-bottom" role="group" aria-label="View controls">
          <button id="camera-mode" type="button" title="Camera mode" aria-label="Camera mode"
            aria-expanded="false" aria-controls="camera-modes">
            <img src="./src/icons/perspective.svg" alt="" />
          </button>
          <div id="camera-modes" role="radiogroup" aria-labelledby="camera-modes-title" hidden>
            <h2 id="camera-modes-title">Camera mode</h2>
            <label>
              <input type="radio" name="projection" value="orthographic" checked />
              <img src="./src/icons/orthographic.svg" alt="" />Orthographic
            </label>
            <label>
              <input type="radio" name="projection" value="perspective" />
              <img src="./src/icons/perspective.svg" alt="" />Perspective
            </label>
          </div>
        </div>
      </section>
    </main>
    <section class="timeline" aria-label="Timeline">
      <h2>Timeline</h2>
      <ol id="features"></ol>
    </section>
    <section class="dock" id="output-dock" aria-label="Output" hidden>
      <div class="tabs" aria-label="Output">
        <button data-dock="console" aria-selected="true">Console</button
        ><button data-dock="log" aria-selected="false">CAD log</button
        ><button data-dock="tree" aria-selected="false">Scene browser</button>
        <button id="dock-location" type="button">Pop out</button>
      </div>
      <div id="console" class="dock-page">
        <div id="console-output" role="log"></div>
        <form id="console-form">
          <label for="js">›</label
          ><input
            id="js"
            autocomplete="off"
            spellcheck="false"
            placeholder="Run JavaScript with core and scene"
            aria-label="JavaScript"
          /><button>Run</button>
        </form>
      </div>
      <div id="log" class="dock-page" hidden></div>
      <div id="tree" class="dock-page" hidden></div>
    </section>
    <footer>
      <div class="status-message">
        <span class="indicator" aria-hidden="true"></span>
        <span id="status" role="status">Starting geometry engine…</span>
        <progress id="progress" hidden></progress>
      </div>
      <div class="status-details" aria-label="Application information">
        <span id="versions"></span><span aria-hidden="true">|</span>
        <span id="memory-footprint">RAM unavailable</span><span aria-hidden="true">|</span>
        <button id="toggle-output" type="button" aria-expanded="false" aria-controls="output-dock">
          <span class="console-icon" aria-hidden="true"></span>Debug console
        </button>
      </div>
    </footer>
    <template id="extrude-fields">
      <h2 class="extrude-heading" tabindex="0">Extrude</h2>
      <div class="tool-fields extrude-fields">
        <p id="selection-hint" hidden></p>
        <section class="extrude-section" aria-labelledby="extrude-profiles-heading">
          <h3 id="extrude-profiles-heading">Profiles</h3>
          <div id="profiles-selection" class="extrude-pick-group">
            <button id="pick-profiles" class="extrude-pick" data-tooltip="Select profiles" aria-label="Select profiles" aria-describedby="selection-hint" type="button"><span class="extrude-pick-icon" aria-hidden="true"></span><span class="extrude-pick-label">Select profiles…</span><span class="extrude-pick-change" hidden>Change</span></button>
            <button id="clear-profiles" class="extrude-clear" data-tooltip="Clear profiles" aria-label="Clear profiles" type="button">×</button>
          </div>
          <label id="extrude-start-field" class="extrude-row"><span>Start</span><select id="extrude-start" data-tooltip="Start">
            <option value="profilePlane">Profile plane</option><option value="offset">Offset</option><option value="object">From a face</option>
          </select></label>
          <label id="offset-field" class="extrude-row formula-field" hidden><span>Offset</span><input id="offset" data-tooltip="Start offset" aria-label="Start offset" value="0" /></label>
          <div id="start-selection" class="extrude-selection" hidden>
            <span class="extrude-label">Starting face</span>
            <div class="extrude-pick-group">
              <button id="pick-start" class="extrude-pick" data-tooltip="Select starting face" aria-label="Select starting face" aria-describedby="selection-hint" type="button"><span class="extrude-pick-icon" aria-hidden="true"></span><span class="extrude-pick-label">Select a face…</span><span class="extrude-pick-change" hidden>Change</span></button>
              <button id="clear-start" class="extrude-clear" data-tooltip="Clear starting face" aria-label="Clear starting face" type="button">×</button>
            </div>
          </div>
        </section>
        <section class="extrude-section" aria-labelledby="extrude-extent-heading">
          <h3 id="extrude-extent-heading">Extent</h3>
          <input id="extrude-type" type="hidden" value="oneSide" />
          <div class="extrude-sides" role="group" aria-label="Extrusion sides">
            <button type="button" data-extrude-type="oneSide" data-tooltip="One side" aria-pressed="true">One side</button>
            <button type="button" data-extrude-type="twoSides" data-tooltip="Two sides" aria-pressed="false">Two sides</button>
            <button type="button" data-extrude-type="symmetric" data-tooltip="Symmetric" aria-pressed="false">Symmetric</button>
          </div>
          <label id="symmetric-field" class="extrude-row" hidden><span>Length means</span><select id="symmetric-length" data-tooltip="Symmetric length: total or half">
            <option value="total">Total length</option><option value="half">Half-length</option>
          </select></label>
          <div id="side1" class="extrude-side">
            <h4 id="side1-heading" hidden>Side 1</h4>
            <label id="extent1-field" class="extrude-row"><span>End condition</span><select id="extent1" data-tooltip="Side 1: end condition">
              <option value="length">Distance</option><option value="throughAll">Through all</option><option value="toObject">To object</option>
            </select></label>
            <label id="length1-field" class="extrude-row formula-field"><span id="length1-label">Length</span><input id="length" data-tooltip="Side 1: length" aria-label="Side 1 length" value="15" /></label>
            <div id="limit1-selection" class="extrude-selection" hidden>
              <span class="extrude-label">Limiting body</span>
              <div class="extrude-pick-group">
                <button id="pick-limit1" class="extrude-pick" data-tooltip="Side 1: select limiting body" aria-label="Side 1: select limiting body" aria-describedby="selection-hint" type="button"><span class="extrude-pick-icon" aria-hidden="true"></span><span class="extrude-pick-label">Select a body…</span><span class="extrude-pick-change" hidden>Change</span></button>
                <button id="clear-limit1" class="extrude-clear" data-tooltip="Side 1: clear limiting body" aria-label="Clear side 1 limiting body" type="button">×</button>
              </div>
              <label id="object-extent1-field" class="extrude-row"><span>Stop at</span><select id="object-extent1" data-tooltip="Side 1: stop at">
                <option value="closest">Closest</option><option value="touch">Touch</option><option value="intersect">Intersect</option><option value="farthest">Farthest</option>
              </select></label>
            </div>
            <label id="taper1-field" class="extrude-row formula-field"><span>Taper angle</span><input id="taper1" data-tooltip="Side 1: taper angle" aria-label="Side 1 taper angle" value="0" /></label>
          </div>
          <div id="side2" class="extrude-side" hidden>
            <h4>Side 2</h4>
            <label id="extent2-field" class="extrude-row"><span>End condition</span><select id="extent2" data-tooltip="Side 2: end condition">
              <option value="length">Distance</option><option value="throughAll">Through all</option><option value="toObject">To object</option>
            </select></label>
            <label id="length2-field" class="extrude-row formula-field"><span>Length</span><input id="length2" data-tooltip="Side 2: length" aria-label="Side 2 length" value="15" /></label>
            <div id="limit2-selection" class="extrude-selection" hidden>
              <span class="extrude-label">Limiting body</span>
              <div class="extrude-pick-group">
                <button id="pick-limit2" class="extrude-pick" data-tooltip="Side 2: select limiting body" aria-label="Side 2: select limiting body" aria-describedby="selection-hint" type="button"><span class="extrude-pick-icon" aria-hidden="true"></span><span class="extrude-pick-label">Select a body…</span><span class="extrude-pick-change" hidden>Change</span></button>
                <button id="clear-limit2" class="extrude-clear" data-tooltip="Side 2: clear limiting body" aria-label="Clear side 2 limiting body" type="button">×</button>
              </div>
              <label id="object-extent2-field" class="extrude-row"><span>Stop at</span><select id="object-extent2" data-tooltip="Side 2: stop at">
                <option value="closest">Closest</option><option value="touch">Touch</option><option value="intersect">Intersect</option><option value="farthest">Farthest</option>
              </select></label>
            </div>
            <label id="taper2-field" class="extrude-row formula-field"><span>Taper angle</span><input id="taper2" data-tooltip="Side 2: taper angle" aria-label="Side 2 taper angle" value="0" /></label>
          </div>
          <label id="extrude-direction-field" class="extrude-reverse" hidden><input id="extrude-reverse" data-tooltip="Reverse extent direction" type="checkbox" /><span>Reverse extent direction</span></label>
        </section>
        <section class="extrude-section" aria-labelledby="extrude-result-heading">
          <h3 id="extrude-result-heading">Result</h3>
          <label id="extrude-mode-field" class="extrude-row"><span>Operation</span><select id="extrude-mode" data-tooltip="Result operation">
            <option value="auto">Auto — New body</option><option value="newBody">New body</option><option value="join">Join</option><option value="cut">Cut</option><option value="intersect">Intersect</option>
          </select></label>
          <div id="targets-section">
            <label id="target-scope-field" class="extrude-row"><span>Targets</span><select id="target-scope" data-tooltip="Target bodies">
              <option value="all">All bodies</option><option value="selected">Selected bodies</option>
            </select></label>
            <div id="target-selection" class="extrude-selection" hidden>
              <div id="targets-selection" class="extrude-pick-group">
                <button id="pick-targets" class="extrude-pick" data-tooltip="Select target bodies" aria-label="Select target bodies" aria-describedby="selection-hint" type="button"><span class="extrude-pick-icon" aria-hidden="true"></span><span class="extrude-pick-label">Select target bodies…</span><span class="extrude-pick-change" hidden>Change</span></button>
                <button id="clear-targets" class="extrude-clear" data-tooltip="Clear target bodies" aria-label="Clear target bodies" type="button">×</button>
              </div>
            </div>
          </div>
        </section>
      </div>
      <div class="actions">
        <p id="extrude-error" class="field-error" role="status"></p>
        <button id="cancel" data-tooltip="Cancel" type="button">Cancel</button>
        <button id="apply" data-tooltip="Apply" type="button">Apply</button>
      </div>
    </template>
    <script type="module" src="./src/bootstrap.ts"></script>
  </body>
</html>
