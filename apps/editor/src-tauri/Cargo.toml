[package]
name = "pamatcad-editor"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pamatcad-core = { path = "../../../src/core" }
pamatcad-host = { path = "../../../src/host" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
font-kit = "0.14.3"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[workspace]

[features]
editor-smoke = ["tauri/custom-protocol"]
