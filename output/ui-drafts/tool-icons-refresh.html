<style>
#tool-icon-refresh{--tr-bg:light-dark(#fff,#20262b);--tr-text:light-dark(#39434b,#e3e9ed);--tr-muted:light-dark(#65727b,#aab8c2);--tr-line:light-dark(#d9dee2,#46535d);--tr-active:light-dark(#e7f1f8,#283e50);--tr-blue:light-dark(#294f6d,#c5ddf0);color:var(--tr-text);font:13px/20px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#tool-icon-refresh *{box-sizing:border-box}
#tool-icon-refresh [hidden]{display:none!important}
#tool-icon-refresh .tr-top{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:0 96px 12px 0;font-weight:600;flex-wrap:wrap}
#tool-icon-refresh .tr-switch{display:flex;gap:4px}
#tool-icon-refresh button{font:inherit;font-size:12px;font-weight:500;line-height:18px;color:var(--tr-text);background:var(--tr-bg);border:1px solid var(--tr-line);border-radius:3px;min-height:30px;padding:4px 10px}
#tool-icon-refresh button[aria-pressed=true]{background:var(--tr-active);color:var(--tr-blue);border-color:var(--tr-blue)}
#tool-icon-refresh .tr-sheet{background:var(--tr-bg);border:1px solid var(--tr-line);border-radius:4px;padding:20px 16px 12px}
#tool-icon-refresh .tr-catalog{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:24px 8px;margin-bottom:24px}
#tool-icon-refresh figure{margin:0;display:flex;align-items:center;flex-direction:column;gap:8px;min-width:0}
#tool-icon-refresh figure img{display:block;width:32px;height:32px}
#tool-icon-refresh figcaption{font-size:12px;line-height:18px;text-align:center}
#tool-icon-refresh .tr-caption{color:var(--tr-muted);font-size:12px;padding-top:12px;border-top:1px solid var(--tr-line)}
#tool-icon-refresh .tr-ribbon{display:flex;gap:16px;flex-wrap:wrap;padding:12px 0}
#tool-icon-refresh .tr-group{display:grid;gap:6px;border-right:1px solid var(--tr-line);padding-right:16px}
#tool-icon-refresh .tr-group:last-child{border:0;padding-right:0}
#tool-icon-refresh .tr-group>span{font-size:12px;color:var(--tr-muted);padding-left:6px}
#tool-icon-refresh .tr-reference,#tool-icon-refresh .tr-tools{display:grid;grid-template-rows:32px 32px;grid-auto-flow:column;grid-auto-columns:36px;gap:4px}
#tool-icon-refresh .tr-reference img{width:24px;height:24px;margin:4px 6px}
#tool-icon-refresh .tr-tools button{display:grid;place-items:center;padding:0;min-height:32px;background:transparent;border:1px solid transparent}
#tool-icon-refresh .tr-tools button[aria-pressed=true]{border-color:var(--tr-blue);background:var(--tr-active)}
#tool-icon-refresh .tr-tools img{width:24px;height:24px}
#tool-icon-refresh .tr-status{font-size:12px;line-height:18px;color:var(--tr-muted);min-height:18px}
@media(max-width:620px){#tool-icon-refresh .tr-catalog{grid-template-columns:repeat(4,minmax(0,1fr))}#tool-icon-refresh .tr-top{padding-right:0;padding-top:42px}}
@media(max-width:370px){#tool-icon-refresh .tr-catalog{grid-template-columns:repeat(3,minmax(0,1fr))}#tool-icon-refresh .tr-sheet{padding:16px 8px 12px}}

<script>
(()=>{
  const root=document.getElementById('tool-icon-refresh');
  const icons=JSON.parse(document.getElementById('tool-refresh-data').textContent);
  const toolbar=root.querySelector('.tr-tools');
  const names={dimension:'Dimension',project:'Project',offset:'Offset',split:'Split',rounding:'Rounding',scale:'Scale',move:'Move',remove:'Remove'};
  let version='draft';let selected='';
  const status=()=>{root.querySelector('.tr-status').textContent=selected?names[selected]+' · active tool preview':version==='draft'?'Draft · existing palette, 2 px outlines':'Current tool icons · Remove is a new proposal';};
  for(const [id,name] of Object.entries(names)){
    const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.setAttribute('aria-label',name);button.setAttribute('data-tooltip',name);button.setAttribute('aria-pressed','false');
    const img=document.createElement('img');img.dataset.tool=id;img.src=icons.draft[id];img.alt='';button.append(img);
    button.addEventListener('click',()=>{selected=selected===id?'':id;toolbar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button&&!!selected)));status();persist();});toolbar.append(button);
  }
  function render(){root.querySelectorAll('[data-tool]').forEach(img=>{const src=icons[version][img.dataset.tool];img.parentElement.hidden=!src;if(src)img.src=src;});if(selected&&!icons[version][selected]){selected='';toolbar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));}root.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===version)));status();}
  function persist(){window.openai?.setWidgetState?.({modelContent:{toolIconVersion:version},privateContent:{selected}})?.catch(()=>{});}
  function restore(value){const s=value?.modelContent;if(s&&['draft','current'].includes(s.toolIconVersion)){version=s.toolIconVersion;render();}}
  root.querySelectorAll('[data-version]').forEach(b=>b.addEventListener('click',()=>{version=b.dataset.version;render();persist();}));
  restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
})();
</script>
