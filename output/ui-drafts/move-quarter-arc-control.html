<div class="viz-dotted-background" id="move-quarter-preview">
  <section class="mc-product" aria-label="Quarter-arc Move control draft">
    <header class="mc-context"><span>Sketch 1</span><span class="mc-divider">/</span><span>Move</span><span class="mc-plane">XY · mm</span></header>
    <div class="mc-workarea">
      <canvas class="mc-canvas" aria-label="A pivot point, detached X and Y arrows, two arcs spanning a quarter circle around a circular rotation grip, and a square for free XY movement."></canvas>
      <button type="button" class="mc-hit" data-handle="x" aria-label="Move along X" data-tooltip="Move X"></button>
      <button type="button" class="mc-hit" data-handle="y" aria-label="Move along Y" data-tooltip="Move Y"></button>
      <button type="button" class="mc-hit" data-handle="a" aria-label="Rotate around pivot" data-tooltip="Rotate"></button>
      <button type="button" class="mc-hit" data-handle="xy" aria-label="Move freely in XY" data-tooltip="Move freely in XY"></button>
      <form class="mc-panel" aria-label="Active Move formula">
        <div class="mc-fields">
          <label class="mc-row" data-row="x"><span>X</span><input name="x" aria-label="Move X formula" value="0 mm" autocomplete="off" spellcheck="false"></label>
          <label class="mc-row" data-row="y"><span>Y</span><input name="y" aria-label="Move Y formula" value="0 mm" autocomplete="off" spellcheck="false"></label>
          <label class="mc-row" data-row="a"><span>Angle</span><input name="a" aria-label="Rotation formula" value="0 deg" autocomplete="off" spellcheck="false"></label>
        </div>
      </form>
    </div>
    <div class="mc-commandbar"><button class="mc-icon cursor-interaction" type="button" data-action="pivot" aria-label="Pick pivot" aria-pressed="false" data-tooltip="Pick pivot"><i data-lucide="crosshair" aria-hidden="true"></i></button><label class="mc-copy"><input type="checkbox" name="copy">Copy</label><div class="mc-actions"><button type="button" data-action="cancel" class="cursor-interaction" data-tooltip="Cancel this move">Cancel</button><button type="button" data-action="apply" class="mc-apply cursor-interaction" data-tooltip="Apply translation and rotation">Apply</button></div></div>
    <footer class="mc-status" role="status" aria-live="polite">Move Y · drag the arrow or enter a formula.</footer>
    <span class="mc-palette" aria-hidden="true"><span data-color="bg"></span><span data-color="ink"></span><span data-color="muted"></span><span data-color="grid"></span><span data-color="handle"></span><span data-color="handleFill"></span><span data-color="selection"></span><span data-color="profile"></span><span data-color="ghost"></span><span data-color="error"></span></span>
  </section>
</div>
<style>
#move-quarter-preview{padding:20px 0}
#move-quarter-preview .mc-product{--mc-bg:light-dark(#ffffff,#20272c);--mc-ink:light-dark(#39434b,#e3e8eb);--mc-muted:light-dark(#65727b,#aab7c0);--mc-grid:light-dark(#edf1f3,#2b343a);--mc-line:light-dark(#d5dde2,#465159);--mc-handle:light-dark(#815a36,#dcb58c);--mc-handleFill:light-dark(#f3e5d7,#483a2f);--mc-selection:light-dark(#d55e00,#ffa35d);--mc-profile:light-dark(#f5f9fc,#243744);--mc-ghost:light-dark(#aab6be,#697781);--mc-error:light-dark(#964650,#e8959d);--mc-accent:light-dark(#d6e7f3,#314e64);--mc-accentText:light-dark(#294f6d,#d5e8f6);--mc-shadow:light-dark(#39434b20,#00000055);position:relative;overflow:hidden;background:var(--mc-bg);color:var(--mc-ink);border:1px solid var(--mc-line);border-radius:5px;font:400 13px/20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#move-quarter-preview .mc-product *{box-sizing:border-box}
#move-quarter-preview .mc-context{height:42px;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--mc-line);font-size:12px}
#move-quarter-preview .mc-divider{color:var(--mc-ghost)}
#move-quarter-preview .mc-plane{margin-left:auto;color:var(--mc-muted);margin-right:80px}
#move-quarter-preview .mc-workarea{position:relative}
#move-quarter-preview .mc-canvas{display:block;width:100%;height:422px;touch-action:none}
#move-quarter-preview .mc-panel{position:absolute;left:0;top:0;width:146px;padding:0;background:var(--mc-bg);border:1px solid var(--mc-handle);border-radius:3px;box-shadow:0 2px 8px var(--mc-shadow);margin:0;z-index:3}
#move-quarter-preview .mc-panel[hidden],#move-quarter-preview .mc-row[hidden]{display:none}
#move-quarter-preview .mc-heading{display:flex;align-items:center;gap:9px;height:44px;padding:0 11px;border-bottom:1px solid var(--mc-line)}
#move-quarter-preview .mc-heading>svg{color:var(--mc-handle);width:20px;height:20px}
#move-quarter-preview strong{font-weight:500}
#move-quarter-preview button{font:inherit;color:var(--mc-ink);background:var(--mc-bg);border:1px solid var(--mc-line);border-radius:3px;min-height:30px;padding:4px 12px}
#move-quarter-preview button:hover{background:var(--mc-profile)}
#move-quarter-preview button.mc-icon{display:grid;place-items:center;width:30px;padding:4px;border-color:transparent;color:var(--mc-handle)}
#move-quarter-preview button.mc-icon[aria-pressed=true]{background:var(--mc-handleFill);border-color:var(--mc-handle)}
#move-quarter-preview .mc-icon svg{width:18px;height:18px}
#move-quarter-preview .mc-fields{padding:3px;display:grid;gap:3px}
#move-quarter-preview .mc-row{display:grid;grid-template-columns:33px minmax(0,1fr);gap:3px;align-items:center}
#move-quarter-preview .mc-row>span{font-size:12px;text-align:center;color:var(--mc-handle)}
#move-quarter-preview .mc-row input{font:inherit;font-variant-numeric:tabular-nums;width:100%;min-width:0;height:29px;padding:4px 6px;color:var(--mc-ink);background:var(--mc-bg);border:0;border-radius:2px}
#move-quarter-preview .mc-row[data-active=true]>span{color:var(--mc-handle);font-weight:500}
#move-quarter-preview .mc-row[data-active=true] input{background:var(--mc-bg)}
#move-quarter-preview .mc-options{padding:0 12px 12px;display:flex;align-items:center}
#move-quarter-preview .mc-options label{display:flex;align-items:center;gap:7px;font-size:12px}
#move-quarter-preview .mc-options input{accent-color:var(--mc-accentText);margin:0}
#move-quarter-preview .mc-commandbar{display:flex;align-items:center;gap:14px;padding:9px 14px;border-top:1px solid var(--mc-line)}
#move-quarter-preview .mc-copy{display:flex;align-items:center;gap:7px;font-size:12px}
#move-quarter-preview .mc-copy input{accent-color:var(--mc-accentText);margin:0}
#move-quarter-preview .mc-actions{display:flex;justify-content:flex-end;gap:8px;margin-left:auto}
#move-quarter-preview button.mc-hit{position:absolute;min-height:0;padding:0;background:transparent;border:0;cursor:move;touch-action:none;z-index:2}
#move-quarter-preview button.mc-hit:hover{background:transparent}
#move-quarter-preview button.mc-hit[data-handle=x]{cursor:ew-resize}
#move-quarter-preview button.mc-hit[data-handle=y]{cursor:ns-resize}
#move-quarter-preview button.mc-apply{background:var(--mc-accent);color:var(--mc-accentText);border-color:var(--mc-accentText)}
#move-quarter-preview .mc-status{min-height:36px;padding:8px 14px;font-size:12px;line-height:18px;border-top:1px solid var(--mc-line);color:var(--mc-muted)}
#move-quarter-preview .mc-status[data-error=true]{color:var(--mc-error)}
#move-quarter-preview .mc-palette{position:absolute;visibility:hidden;pointer-events:none}
#move-quarter-preview [data-color=bg]{color:var(--mc-bg)}
#move-quarter-preview [data-color=ink]{color:var(--mc-ink)}
#move-quarter-preview [data-color=muted]{color:var(--mc-muted)}
#move-quarter-preview [data-color=grid]{color:var(--mc-grid)}
#move-quarter-preview [data-color=handle]{color:var(--mc-handle)}
#move-quarter-preview [data-color=handleFill]{color:var(--mc-handleFill)}
#move-quarter-preview [data-color=selection]{color:var(--mc-selection)}
#move-quarter-preview [data-color=profile]{color:var(--mc-profile)}
#move-quarter-preview [data-color=ghost]{color:var(--mc-ghost)}
#move-quarter-preview [data-color=error]{color:var(--mc-error)}
@media(max-width:650px){#move-quarter-preview .mc-canvas{height:370px}#move-quarter-preview .mc-plane{margin-right:65px}#move-quarter-preview .mc-commandbar{gap:8px;padding:9px}}
@media(pointer:coarse){#move-quarter-preview .mc-row input{font-size:16px;height:44px}#move-quarter-preview button{min-height:44px}#move-quarter-preview button.mc-icon{width:44px}#move-quarter-preview .mc-heading{height:52px}#move-quarter-preview .mc-options label{min-height:38px}}
</style>
<script>
(()=>{
  const root=document.getElementById('move-quarter-preview'),product=root.querySelector('.mc-product'),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),form=root.querySelector('form'),status=root.querySelector('.mc-status'),pivotButton=root.querySelector('[data-action=pivot]');
  const fields=Object.fromEntries(['x','y','a'].map(k=>[k,form.elements[k]]));
  const appearance={ring:100,reach:162,blocked:false};
  const buttons=Object.fromEntries([...root.querySelectorAll('[data-handle]')].map(el=>[el.dataset.handle,el]));
  let values={x:0,y:0,a:0},sources={x:'0 mm',y:'0 mm',a:'0 deg'},pivot=[0,0],baseline={x:0,y:0,a:0},copies=[],hover='',active='y',drag=null,picking=false;
  let width=736,height=422,center=[260,240];
  const format=n=>String(Math.round(n*100)/100);
  const unit=k=>k==='a'?'deg':'mm';
  const color=key=>getComputedStyle(root.querySelector('[data-color="'+key+'"]')).color;
  const message=(text,error=false)=>{status.textContent=text;status.dataset.error=String(error);};
  function point(event){const r=canvas.getBoundingClientRect();return[event.clientX-r.left,event.clientY-r.top];}
  function origin(){return[center[0]+pivot[0]+values.x*4,center[1]+pivot[1]-values.y*4];}
  function reach(){return Math.min(appearance.reach,width*.55);}
  function show(mode){active=mode;message(mode==='xy'?'Move freely in XY · drag the square or enter X and Y.':mode==='a'?'Rotate · drag the circular grip or enter an angle.':mode?'Move '+mode.toUpperCase()+' · drag the arrow or enter a formula.':'Select a handle to move, rotate, or enter a formula.');draw();}
  function path(points,stroke,weight=1.5){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=stroke;ctx.lineWidth=weight;ctx.stroke();}
  function profile(t,ghost=false){
    ctx.save();ctx.translate(center[0]+pivot[0]+t.x*4,center[1]+pivot[1]-t.y*4);ctx.rotate(-t.a*Math.PI/180);ctx.translate(-pivot[0],-pivot[1]);
    ctx.translate(baseline.x*4,-baseline.y*4);ctx.rotate(-baseline.a*Math.PI/180);
    ctx.beginPath();ctx.moveTo(-108,82);ctx.lineTo(-108,-46);ctx.lineTo(53,-46);ctx.quadraticCurveTo(112,-46,112,12);ctx.lineTo(112,82);ctx.closePath();
    ctx.fillStyle=color('profile');ctx.strokeStyle=color(ghost?'ghost':'selection');ctx.lineWidth=ghost?1:1.6;if(ghost)ctx.setLineDash([4,5]);else ctx.fill();ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(-63,31,15,0,Math.PI*2);ctx.stroke();
    if(!ghost)for(const [x,y]of[[-108,82],[-108,-46],[53,-46],[112,12],[112,82]]){ctx.beginPath();ctx.arc(x,y,2.7,0,7);ctx.fillStyle=color('selection');ctx.fill();}
    ctx.restore();
  }
  function draw(){
    const rect=canvas.getBoundingClientRect();width=rect.width;height=rect.height;
    const ratio=window.devicePixelRatio||1;if(canvas.width!==Math.round(width*ratio)||canvas.height!==Math.round(height*ratio)){canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);}
    ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,width,height);center=[width>650?width*.34:width*.18,height*.70];
    ctx.lineCap='round';ctx.lineJoin='round';
    for(let x=center[0]%32;x<width;x+=32)path([[x,0],[x,height]],color('grid'),.65);
    for(let y=center[1]%32;y<height;y+=32)path([[0,y],[width,y]],color('grid'),.65);
    for(const copy of copies)profile(copy,true);
    if(values.x||values.y||values.a)profile({x:0,y:0,a:0},true);profile(values);
    const [cx,cy]=origin(),r=appearance.ring,end=reach(),ink=color('handle'),angle=(-45-values.a)*Math.PI/180;
    ctx.save();ctx.translate(cx,cy);
    // The two arcs span 90 degrees; the grip can continue around the pivot without an angle limit.
    ctx.strokeStyle=ink;ctx.lineWidth=hover==='a'||active==='a'?2:1.5;
    for(const[a,b]of[[angle-Math.PI/4,angle-.13],[angle+.13,angle+Math.PI/4]]){ctx.beginPath();ctx.arc(0,0,r,a,b);ctx.stroke();}
    ctx.beginPath();ctx.arc(Math.cos(angle)*r,Math.sin(angle)*r,6.5,0,7);ctx.fillStyle=hover==='a'||active==='a'?color('handleFill'):color('bg');ctx.fill();ctx.stroke();
    path([[r+16,0],[end,0]],ink,hover==='x'||active==='x'?2:1.6);path([[end-10,-7],[end,0],[end-10,7]],ink,hover==='x'||active==='x'?2:1.6);
    path([[0,-r-16],[0,-end]],ink,hover==='y'||active==='y'?2:1.6);path([[-7,-end+10],[0,-end],[7,-end+10]],ink,hover==='y'||active==='y'?2:1.6);
    ctx.fillStyle=ink;ctx.font='500 12px system-ui';ctx.textAlign='center';ctx.fillText('X',end+17,4);ctx.fillText('Y',0,-end-14);
    ctx.beginPath();ctx.rect(14,-38,24,24);ctx.fillStyle=color('handleFill');ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=hover==='xy'||active==='xy'?2:1.2;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,picking?5:3.5,0,7);ctx.fillStyle=ink;ctx.fill();
    ctx.restore();
    const hitboxes={x:[cx+r+6,cy-22,end-r+26,44],y:[cx-22,cy-end-12,44,end-r+26],a:[cx+Math.cos(angle)*r-22,cy+Math.sin(angle)*r-22,44,44],xy:[cx+4,cy-48,44,44]};
    for(const [key,[x,y,w,h]]of Object.entries(hitboxes)){Object.assign(buttons[key].style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});buttons[key].setAttribute('aria-pressed',String(active===key));}
    form.hidden=!active||picking;
    for(const key of ['x','y','a']){const row=root.querySelector('[data-row='+key+']');row.hidden=active!==key&&!(active==='xy'&&key!=='a');row.dataset.active=String(!row.hidden);if(document.activeElement!==fields[key])fields[key].value=format(values[key])+' '+unit(key);}
    if(active){let x,y;const gx=cx+Math.cos(angle)*r,gy=cy+Math.sin(angle)*r;
      if(active==='x'){x=cx+end-66;y=cy-57;}else if(active==='y'){x=cx+18;y=cy-end-17;}else if(active==='xy'){x=cx+58;y=cy-35;}else{x=gx+20;y=gy-18;}
      x=Math.max(8,Math.min(width-form.offsetWidth-8,x));y=Math.max(8,Math.min(height-form.offsetHeight-8,y));
      if(active==='a'&&gx>x-12&&gx<x+form.offsetWidth+12&&gy>y-12&&gy<y+form.offsetHeight+12)y=Math.max(8,gy-form.offsetHeight-20);
      form.style.left=x+'px';form.style.top=y+'px';
    }
    pivotButton.setAttribute('aria-pressed',String(picking));
  }
  function hit(p){const o=origin(),x=p[0]-o[0],y=p[1]-o[1],end=reach(),angle=(-45-values.a)*Math.PI/180,delta=Math.atan2(Math.sin(Math.atan2(y,x)-angle),Math.cos(Math.atan2(y,x)-angle));if(x>4&&x<48&&y<-4&&y>-48)return'xy';if(Math.abs(y)<22&&x>appearance.ring+6&&x<end+12)return'x';if(Math.abs(x)<22&&y<-appearance.ring-6&&y>-end-12)return'y';if(Math.abs(Math.hypot(x,y)-appearance.ring)<14&&Math.abs(delta)<Math.PI/4+.08)return'a';return'';}
  function save(){window.openai?.setWidgetState?.({modelContent:{design:'quarter-arc-move',translation:[values.x,values.y],angle:values.a,pivot},privateContent:{values,sources,pivot,appearance,active}})?.catch(()=>{});}
  function accept(next){if(appearance.blocked){message('Constraints prevent this move.',true);draw();return false;}values=next;draw();return true;}
  function start(e){
    if(e.button!==0)return;if(form.contains(document.activeElement))document.activeElement.blur();const p=point(e);
    if(picking){pivot=[p[0]-center[0]-values.x*4,p[1]-center[1]+values.y*4];picking=false;message('Pivot set.');draw();save();return;}
    const mode=e.currentTarget.dataset.handle||hit(p);if(!mode){show('');return;}e.preventDefault();show(mode);drag={mode,start:p,values:{...values},sources:{...sources},origin:origin(),moved:false,rotation:0};drag.lastAngle=Math.atan2(p[1]-drag.origin[1],p[0]-drag.origin[0]);hover=mode;canvas.setPointerCapture(e.pointerId);draw();
  }
  canvas.addEventListener('pointerdown',start);
  for(const [mode,button]of Object.entries(buttons)){button.addEventListener('pointerdown',start);button.addEventListener('pointerenter',()=>{hover=mode;draw();});button.addEventListener('pointerleave',()=>{if(!drag){hover='';draw();}});button.addEventListener('focus',()=>show(mode));button.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(mode);fields[mode==='xy'?'x':mode].focus();fields[mode==='xy'?'x':mode].select();}});}
  canvas.addEventListener('pointermove',e=>{
    const p=point(e);if(!drag){hover=hit(p);canvas.style.cursor=picking?'crosshair':hover==='x'?'ew-resize':hover==='y'?'ns-resize':hover?'move':'default';draw();return;}
    const next={...drag.values},dx=(p[0]-drag.start[0])/4,dy=(drag.start[1]-p[1])/4;drag.moved||=Math.hypot(dx,dy)>.25;
    if(drag.mode==='x'||drag.mode==='xy')next.x=Math.round((next.x+dx)*2)/2;
    if(drag.mode==='y'||drag.mode==='xy')next.y=Math.round((next.y+dy)*2)/2;
    if(drag.mode==='a'){const now=Math.atan2(p[1]-drag.origin[1],p[0]-drag.origin[0]);drag.rotation+=Math.atan2(Math.sin(now-drag.lastAngle),Math.cos(now-drag.lastAngle));drag.lastAngle=now;next.a=Math.round((next.a-drag.rotation*180/Math.PI)/5)*5;}
    if(accept(next))for(const k of ['x','y','a'])if(next[k]!==drag.values[k])sources[k]=format(next[k])+' '+unit(k);
  });
  function stop(e){if(!drag)return;const mode=drag.mode,moved=drag.moved;if(e.type==='pointercancel'){values=drag.values;sources=drag.sources;}drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);draw();if(!moved&&e.type==='pointerup'){fields[mode==='xy'?'x':mode].focus();fields[mode==='xy'?'x':mode].select();}save();}
  canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('pointerleave',()=>{if(!drag){hover='';draw();}});
  function evaluate(source,key){
    const dimension=key==='a'?'angle':'length';
    let text=source.toLowerCase().replace(/\b(mm|cm|in|deg|rad|m)\b/g,(match)=>{const scales=dimension==='angle'?{deg:1,rad:180/Math.PI}:{mm:1,cm:10,m:1000,in:25.4};if(!(match in scales))throw Error('unit');return'*'+scales[match];}).replace(/\s/g,'');
    if(!text||/[^\d.e+*/()\-]/.test(text))throw Error('formula');
    const tokens=text.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?|[()+*/-]/g)||[];if(tokens.join('')!==text)throw Error('formula');let at=0;
    const atom=()=>{const token=tokens[at++];if(token==='+'||token==='-')return(token==='-'?-1:1)*atom();if(token==='('){const n=sum();if(tokens[at++]!==')')throw Error('formula');return n;}if(token===undefined||!Number.isFinite(Number(token)))throw Error('formula');return Number(token);};
    const product=()=>{let n=atom();while(tokens[at]==='*'||tokens[at]==='/'){const op=tokens[at++],v=atom();n=op==='*'?n*v:n/v;}return n;};
    const sum=()=>{let n=product();while(tokens[at]==='+'||tokens[at]==='-'){const op=tokens[at++],v=product();n=op==='+'?n+v:n-v;}return n;};
    const result=sum();if(at!==tokens.length||!Number.isFinite(result))throw Error('formula');return result;
  }
  for(const key of ['x','y','a']){
    fields[key].addEventListener('focus',()=>{fields[key].value=sources[key];hover=active;draw();});
    fields[key].addEventListener('change',()=>{try{const source=fields[key].value,next={...values,[key]:evaluate(source,key)};if(accept(next))sources[key]=source;else fields[key].value=sources[key];}catch{fields[key].value=sources[key];message('Enter a length or angle formula.',true);}save();});
    fields[key].addEventListener('blur',()=>{hover='';draw();});
    fields[key].addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();fields[key].blur();if(active==='xy'&&key==='x'){fields.y.focus();fields.y.select();}else show('');}if(e.key==='Escape'){fields[key].value=sources[key];fields[key].blur();show('');}});
  }
  pivotButton.addEventListener('click',()=>{picking=!picking;message(picking?'Pick the pivot in the sketch.':'Pivot selection cancelled.');draw();});
  root.querySelector('[data-action=cancel]').addEventListener('click',()=>{values={x:0,y:0,a:0};sources={x:'0 mm',y:'0 mm',a:'0 deg'};picking=false;active='';message('Move cancelled.');draw();save();});
  root.querySelector('[data-action=apply]').addEventListener('click',()=>{if(appearance.blocked){message('Constraints prevent this move.',true);return;}if(root.querySelector('[name=copy]').checked)copies.push({x:0,y:0,a:0});baseline={x:baseline.x+values.x,y:baseline.y+values.y,a:baseline.a+values.a};values={x:0,y:0,a:0};sources={x:'0 mm',y:'0 mm',a:'0 deg'};active='';message('Move applied.');draw();save();});
  form.addEventListener('submit',e=>e.preventDefault());
  function restore(state){const saved=state?.privateContent;if(saved?.values&&Object.values(saved.values).every(Number.isFinite)){values={...values,...saved.values};sources={...sources,...saved.sources};if(Array.isArray(saved.pivot)&&saved.pivot.length===2&&saved.pivot.every(Number.isFinite))pivot=saved.pivot;if(saved.appearance)Object.assign(appearance,saved.appearance);if(['','x','y','a','xy'].includes(saved.active))active=saved.active;}draw();}
  restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  new ResizeObserver(draw).observe(canvas);window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
  if(globalThis.Tweak){const tweak=new Tweak({container:product,onChange:()=>{message(appearance.blocked?'Selected geometry is constrained.':'Select a handle to move, rotate, or enter a formula.');draw();save();}});tweak.addSlider(appearance,'ring',{label:'Quarter-arc radius',min:80,max:106,unit:'px'});tweak.addSlider(appearance,'reach',{label:'Arrow reach',min:150,max:180,unit:'px'});tweak.addToggle(appearance,'blocked',{label:'Constrained geometry'});}
})();
</script>
