<script>
(()=>{
  const root=document.getElementById('constraint-graphite-draft');
  const icons=JSON.parse(document.getElementById('constraint-graphite-data').textContent);
  const tools=root.querySelector('.ci-tools');
  const names={equal:'Equal',coincident:'Coincident',fix:'Fix',concentric:'Concentric',midpoint:'Midpoint',parallel:'Parallel',perpendicular:'Perpendicular',tangent:'Tangent',horizontal:'Horizontal',vertical:'Vertical',symmetric:'Symmetric',collinear:'Collinear','point-on-curve':'Point on curve'};
  let version='draft';let selected='';
  for(const [id,name] of Object.entries(names)){
    const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.setAttribute('aria-label',name);button.setAttribute('data-tooltip',name);button.setAttribute('aria-pressed','false');
    const img=document.createElement('img');img.dataset.icon=id;img.src=icons.draft[id];img.alt='';button.append(img);
    button.addEventListener('click',()=>{selected=selected===id?'':id;tools.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button&&!!selected)));root.querySelector('.ci-status').textContent=selected?names[selected]+' · preview of the active tool':version==='draft'?'Graphite #65727B · highlight #16A34A':'Current constraint icons';persist();});tools.append(button);
  }
  function render(){root.querySelectorAll('[data-icon]').forEach(img=>img.src=icons[version][img.dataset.icon]);root.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===version)));root.querySelector('.ci-status').textContent=version==='draft'?'Graphite #65727B · highlight #16A34A':'Current constraint icons';}
  function persist(){window.openai?.setWidgetState?.({modelContent:{graphiteDraftVersion:version},privateContent:{selected}})?.catch(()=>{});}
  function restore(value){const s=value?.modelContent;if(s&&['draft','current'].includes(s.graphiteDraftVersion)){version=s.graphiteDraftVersion;render();}}
  root.querySelectorAll('[data-version]').forEach(b=>b.addEventListener('click',()=>{version=b.dataset.version;render();persist();}));
  restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
})();
</script>
