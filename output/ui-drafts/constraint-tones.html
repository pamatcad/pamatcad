#constraint-tone-draft .ci-tools img{width:24px;height:24px}

<script>
(()=>{
  const root=document.getElementById('constraint-tone-draft');
  const icons=JSON.parse(document.getElementById('constraint-tone-data').textContent);
  const tools=root.querySelector('.ci-tools');
  const names={equal:'Equal',coincident:'Coincident',fix:'Fix',concentric:'Concentric',midpoint:'Midpoint',parallel:'Parallel',perpendicular:'Perpendicular',tangent:'Tangent',horizontal:'Horizontal',vertical:'Vertical',symmetric:'Symmetric',collinear:'Collinear','point-on-curve':'Point on curve'};
  let version='draft';let selected='';
  for(const [id,name] of Object.entries(names)){
    const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.setAttribute('aria-label',name);button.setAttribute('data-tooltip',name);button.setAttribute('aria-pressed','false');
    const img=document.createElement('img');img.dataset.icon=id;img.src=icons.draft[id];img.alt='';button.append(img);
    button.addEventListener('click',()=>{selected=selected===id?'':id;tools.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button&&!!selected)));root.querySelector('.ci-status').textContent=selected?names[selected]+' · preview of the active tool':version==='draft'?'Muted plum · #80658A':'Graphite · #65727B';persist();});tools.append(button);
  }
  function render(){root.querySelectorAll('[data-icon]').forEach(img=>img.src=icons[version][img.dataset.icon]);root.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===version)));root.querySelector('.ci-status').textContent=version==='draft'?'Muted plum · #80658A':'Graphite · #65727B';}
  function persist(){window.openai?.setWidgetState?.({modelContent:{constraintTone:version},privateContent:{selected}})?.catch(()=>{});}
  function restore(value){const s=value?.modelContent;if(s&&['draft','current'].includes(s.constraintTone)){version=s.constraintTone;render();}}
  root.querySelectorAll('[data-version]').forEach(b=>b.addEventListener('click',()=>{version=b.dataset.version;render();persist();}));
  restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
})();
</script>
